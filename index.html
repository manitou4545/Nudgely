<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nudgely – Get paid without chasing</title>
<style>
:root{--ink:#222;--muted:#6B6B6B;--line:#E3E3E3;--field:#F1F1F1;--green:#2E8B1E;--orange:#E58A1F;--okc:#0F6B63;--okb:#DDF0EC;--wc:#8A5A00;--wb:#FFF1CC;--bc:#B3261E;--bb:#FBE1DE;color-scheme:light}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--orange);padding:14px 0;margin-bottom:24px}
.logo{font-size:30px;letter-spacing:-.01em;color:var(--muted)}.logo i{font-style:normal;color:var(--orange)}
button{font:inherit;cursor:pointer;border:1.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:6px;padding:10px 14px;min-height:44px;font-weight:600}
button.pri{background:var(--green);border-color:var(--green);color:#fff;text-transform:uppercase;letter-spacing:.02em}
button:disabled{opacity:.6}
button:focus-visible,input:focus-visible{outline:3px solid var(--green);outline-offset:2px}
h1{font-size:clamp(32px,9vw,44px);line-height:1.15;font-weight:300;letter-spacing:-.01em;margin:0 0 8px}
h2{font-size:28px;font-weight:300;margin:32px 0 12px}
.free{font-size:20px;margin:0 0 18px}
.sub{font-size:14px;color:var(--muted);display:block}
form,.add{display:grid;gap:12px}
label{display:grid;gap:4px;font-size:17px}
input{font:inherit;color:var(--ink);background:var(--field);border:0;border-radius:6px;padding:14px;min-height:48px;width:100%}
#err,#aerr{color:var(--bc);font-size:14px;margin:0;min-height:20px}
.link{background:none;border:0;color:var(--green);text-decoration:underline;padding:6px 0;min-height:0;text-align:left}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--field);border-radius:6px;padding:14px}.stat b{display:block;font-size:26px}.stat span{font-size:14px;color:var(--muted)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:6px;padding:14px}
.row.bad{border-left-color:var(--bc)}.row.warn{border-left-color:var(--wc)}.row.paid{border-left-color:var(--okc);opacity:.75}
.top,.mid{display:flex;justify-content:space-between;align-items:center;gap:10px}.mid{margin-top:8px}
.tag{font-size:14px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--line)}
.tag.bad{background:var(--bb);color:var(--bc)}.tag.warn{background:var(--wb);color:var(--wc)}.tag.paid{background:var(--okb);color:var(--okc)}
.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1}
.empty{text-align:center;color:var(--muted);padding:24px}
#shade{position:fixed;inset:0;background:rgba(10,16,30,.55);display:none}#shade.on{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease}
#sheet.on{transform:none}
.seg{display:flex;gap:8px;margin:10px 0}.seg button{flex:1}.seg button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
#msg{white-space:pre-wrap;background:var(--field);border-radius:6px;padding:12px;font-size:15px;margin:0 0 12px;max-height:34vh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-weight:600;display:none;max-width:90%}
.pms{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.pms button{flex:1}.pms button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.addr{word-break:break-all;background:var(--field);padding:12px;border-radius:6px;font-family:ui-monospace,Menlo,monospace;font-size:14px;margin:6px 0 10px}
#pd{display:grid;gap:10px}#pd p{margin:0}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><span class="logo">Nudge<i>ly</i></span><button type="button" id="out" class="hide">Sign out</button></header>

<section id="auth" class="hide">
  <h1 id="at">Create your account</h1>
  <h3 class="free">No credit card required</h3>
  <form id="af">
    <label>Email<input id="em" type="email" autocomplete="email" placeholder="you@example.com"></label>
    <label>Password<input id="pw" type="password" autocomplete="current-password" placeholder="At least 6 characters"></label>
    <p id="err" role="alert"></p>
    <button class="pri" id="go" type="submit">Create account</button>
    <button class="link" id="sw" type="button">I already have an account</button>
  </form>
</section>

<section id="app" class="hide">
  <h1>Your invoices</h1>
  <div class="stats">
    <div class="stat"><b id="tot">$0</b><span>Outstanding</span></div>
    <div class="stat"><b id="late">0</b><span>Overdue invoices</span></div>
  </div>
  <ul id="list"></ul>
  <h2>Add an invoice</h2>
  <div class="add">
    <label>Client name<input id="f-name" autocomplete="off"></label>
    <label>Client email<input id="f-mail" type="email" autocomplete="off"></label>
    <label>Invoice number (optional)<input id="f-num" autocomplete="off"></label>
    <label>Amount (USD)<input id="f-amt" type="number" inputmode="decimal" min="1"></label>
    <label>Due date<input id="f-due" type="date"></label>
    <p id="aerr" role="alert"></p>
    <button class="pri" id="add" type="button">Add invoice</button>
  </div>
  <h2>Upgrade to Pro</h2>
  <p class="sub" style="font-size:16px">$12 a month: unlimited invoices and automatic reminders.</p>
  <div class="pms" id="pm"></div>
  <div id="pd"></div>
</section>
<p id="fatal" class="hide" role="alert"></p>
</div>

<div id="shade"></div>
<div id="sheet" role="dialog" aria-label="Reminder preview">
  <b id="to"></b>
  <div class="seg"><button type="button" data-tone="friendly" aria-pressed="true">Friendly</button><button type="button" data-tone="firm" aria-pressed="false">Firm</button></div>
  <div id="msg"></div>
  <div class="acts"><button type="button" id="cancel">Cancel</button><button type="button" id="copy">Copy</button><button type="button" class="pri" id="mail">Send email</button></div>
</div>
<div id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="payments.js"></script>
<script>
const SB_URL="https://eycgkbfjvtcejfrnwlhp.supabase.co";
const SB_KEY="sb_publishable_1IbzYcFo5D2-b9eNzgMHfA_-BmDx7tZ";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=n=>n+" day"+(n===1?"":"s");
const money=(v,c)=>{try{return new Intl.NumberFormat("en-US",{style:"currency",currency:c||"USD"}).format(v)}catch(e){return v+" "+c}};
let db,inv=[],up=true,tone="friendly",cur=null;
function toast(t){const e=$("#toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",2600)}
function today(){const d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5}
const dueIn=i=>Math.round(Date.parse(i.due_date)/864e5-today());
function status(i){
 if(i.status==="paid")return["paid","Paid"];
 const d=dueIn(i);
 if(d<0)return["bad","Overdue "+days(-d)];
 if(d===0)return["warn","Due today"];
 return[d<=7?"warn":"",("Due in "+days(d))];
}
function nudged(i){
 if(!i.last_reminded_at)return"Not nudged yet";
 const n=Math.floor((Date.now()-Date.parse(i.last_reminded_at))/864e5);
 return n<=0?"Nudged today":"Nudged "+days(n)+" ago";
}
function view(name){["auth","app"].forEach(k=>$("#"+k).classList.toggle("hide",k!==name));$("#out").classList.toggle("hide",name!=="app")}
function setMode(){
 $("#at").textContent=up?"Create your account":"Sign in";
 $("#go").textContent=up?"Create account":"Sign in";
 $("#sw").textContent=up?"I already have an account":"Create a new account";
 $("#err").textContent="";
}
async function load(){
 const{data,error}=await db.from("invoices").select("*, clients(name,email)").order("due_date");
 if(error){toast(error.message);return}
 inv=data;render();
}
function render(){
 const open=inv.filter(i=>i.status!=="paid");
 $("#tot").textContent=money(open.reduce((s,i)=>s+Number(i.amount),0),"USD");
 $("#late").textContent=open.filter(i=>dueIn(i)<0).length;
 const rows=[...inv].sort((a,b)=>(a.status==="paid")-(b.status==="paid")||a.due_date.localeCompare(b.due_date));
 $("#list").innerHTML=rows.length?rows.map(i=>{
  const[c,t]=status(i),paid=i.status==="paid";
  return `<li class="row ${c||""}"><div class="top"><div><b>${esc(i.clients?.name)}</b><span class="sub">${esc(i.number||"No number")}</span></div><b>${money(i.amount,i.currency)}</b></div><div class="mid"><span class="tag ${c||""}">${t}</span><span class="sub">${paid?"":nudged(i)}</span></div>${paid?"":`<div class="acts"><button class="pri" data-a="nudge" data-id="${i.id}">Nudge</button><button data-a="paid" data-id="${i.id}">Mark paid</button></div>`}</li>`;
 }).join(""):`<li class="empty">No invoices yet. Add one below and Nudgely will track it.</li>`;
}
function draft(){
 const i=cur,f=(i.clients?.name||"there").split(" ")[0],m=money(i.amount,i.currency),d=dueIn(i),n=i.number?"invoice "+i.number:"your invoice";
 if(tone==="friendly"){
  const w=d<0?"was due "+days(-d)+" ago":d===0?"is due today":"is due in "+days(d);
  return `Hi ${f},\n\nA quick reminder that ${n} for ${m} ${w}. If it’s already on its way, thank you, and please ignore this note.\n\nThanks,`;
 }
 const w=d<0?"is "+days(-d)+" past due. Please send payment by Friday or tell me when to expect it.":"is due "+(d===0?"today":"in "+days(d))+". Please confirm that payment will arrive on time.";
 return `Hello ${f},\n\n${n[0].toUpperCase()+n.slice(1)} for ${m} ${w}\n\nRegards,`;
}
function build(){
 $("#to").textContent="To: "+(cur.clients?.name||"")+" ("+(cur.clients?.email||"")+")";
 $("#msg").textContent=draft();
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tone===tone));
}
const openSheet=()=>{$("#shade").classList.add("on");$("#sheet").classList.add("on")};
const closeSheet=()=>{$("#shade").classList.remove("on");$("#sheet").classList.remove("on")};
async function markNudged(){
 const{error}=await db.from("invoices").update({last_reminded_at:new Date().toISOString()}).eq("id",cur.id);
 if(error)toast(error.message);else await load();
}
$("#list").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 const i=inv.find(x=>x.id===b.dataset.id);if(!i)return;
 if(b.dataset.a==="paid"){
  const{error}=await db.from("invoices").update({status:"paid"}).eq("id",i.id);
  if(error)toast(error.message);else{await load();toast("Marked as paid")}
 }else{cur=i;build();openSheet()}
});
document.querySelector(".seg").addEventListener("click",e=>{const b=e.target.closest("button");if(b){tone=b.dataset.tone;build()}});
$("#cancel").onclick=closeSheet;$("#shade").onclick=closeSheet;
$("#copy").onclick=async()=>{
 try{await navigator.clipboard.writeText($("#msg").textContent);toast("Message copied")}catch(e){toast("Could not copy. Select the text instead.")}
 await markNudged();closeSheet();
};
$("#mail").onclick=async()=>{
 const sub="Reminder: "+(cur.number?"invoice "+cur.number:"your invoice");
 const href="mailto:"+encodeURIComponent(cur.clients?.email||"")+"?subject="+encodeURIComponent(sub)+"&body="+encodeURIComponent($("#msg").textContent);
 await markNudged();closeSheet();location.href=href;
};
$("#add").onclick=async()=>{
 const name=$("#f-name").value.trim(),email=$("#f-mail").value.trim().toLowerCase(),num=$("#f-num").value.trim(),amt=parseFloat($("#f-amt").value),due=$("#f-due").value,er=$("#aerr");
 if(!name||!email||!(amt>0)||!due){er.textContent="Enter a client name, an email, an amount and a due date.";return}
 er.textContent="";$("#add").disabled=true;
 let{data:c,error}=await db.from("clients").select("id").eq("email",email).maybeSingle();
 let cid=c?.id;
 if(!error&&!cid){const r=await db.from("clients").insert({name,email}).select("id").single();error=r.error;cid=r.data?.id}
 if(!error){const r=await db.from("invoices").insert({client_id:cid,number:num||null,amount:amt,due_date:due});error=r.error}
 $("#add").disabled=false;
 if(error){er.textContent=error.message;return}
 ["#f-name","#f-mail","#f-num","#f-amt","#f-due"].forEach(s=>$(s).value="");
 await load();toast("Invoice added");
};
$("#sw").onclick=()=>{up=!up;setMode()};
$("#af").addEventListener("submit",async e=>{
 e.preventDefault();
 const email=$("#em").value.trim(),password=$("#pw").value;
 if(!email||password.length<6){$("#err").textContent="Enter an email and a password of at least 6 characters.";return}
 $("#go").disabled=true;$("#err").textContent="";
 const r=up?await db.auth.signUp({email,password}):await db.auth.signInWithPassword({email,password});
 $("#go").disabled=false;
 if(r.error)$("#err").textContent=r.error.message;
 else if(up&&!r.data.session)$("#err").textContent="Check your email to confirm your account, then sign in.";
});
const P=window.PAYMENTS||{},PRICE=P.price||12;
let pm=null;
const usdt=()=>(P.usdt||[]).filter(x=>x.address);
function refForm(){return `<label>Transaction ID<input id="ref" autocomplete="off"></label><p id="perr" role="alert"></p><button class="pri" type="button" id="paid">I have paid</button>`}
function renderPay(){
 const m=[];
 if(usdt().length)m.push(["usdt","USDT (TRC20)"]);
 m.push(["bank","Bank transfer"]);
 if(P.orange)m.push(["orange","Orange Money"]);
 if(!pm||!m.some(x=>x[0]===pm))pm=m[0][0];
 $("#pm").innerHTML=m.map(x=>`<button type="button" data-m="${x[0]}" aria-pressed="${x[0]===pm}">${x[1]}</button>`).join("");
 let h="";
 if(pm==="usdt")h=`<p>Send <b>${PRICE} USDT</b> on the <b>TRC20 (Tron)</b> network only. Any other network and the funds are lost.</p>`+usdt().map(x=>`<div><span class="sub">${esc(x.label)}</span><div class="addr">${esc(x.address)}</div><button type="button" data-copy="${esc(x.address)}">Copy address</button></div>`).join("")+refForm();
 else if(pm==="bank")h=`<p>Pay by bank transfer. Tap the button and we’ll email you our bank details.</p><button class="pri" type="button" id="bankreq">Request bank details</button>`;
 else h=`<p>Send the equivalent of $${PRICE} to this Orange Money number:</p><div class="addr">${esc(P.orange)}</div>`+refForm();
 $("#pd").innerHTML=h;
}
$("#pm").addEventListener("click",e=>{const b=e.target.closest("button");if(b){pm=b.dataset.m;renderPay()}});
$("#pd").addEventListener("click",async e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast("Address copied")}catch(x){toast("Could not copy. Select the text instead.")}return}
 let ref=null;
 if(b.id==="paid"){ref=$("#ref").value.trim();if(!ref){$("#perr").textContent="Paste your transaction ID first.";return}}
 else if(b.id!=="bankreq")return;
 b.disabled=true;
 const{data:{user}}=await db.auth.getUser();
 const{error}=await db.from("payment_requests").insert({method:pm,reference:ref,email:user?user.email:null});
 b.disabled=false;
 if(error){toast(error.message);return}
 $("#pd").innerHTML=`<p><b>Thank you!</b> ${pm==="bank"?"We will email you our bank details shortly.":"We will check your payment and activate Pro."}</p>`;
});
$("#out").onclick=()=>db.auth.signOut();
if(!window.supabase){const f=$("#fatal");f.textContent="Could not load the app. Check your connection and reload.";f.classList.remove("hide")}
else{
 db=supabase.createClient(SB_URL,SB_KEY);
 db.auth.onAuthStateChange((_e,s)=>{if(s&&s.user){view("app");load();renderPay()}else{view("auth");setMode()}});
}
</script>
</body>
</html>
